[project]
name = "floodwatch-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "osmnx>=2.1.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "pyproj>=3.6",
    "python-socketio[asyncio-client]>=5.18.1",
    "pyyaml>=6.0.3",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
    "pymongo>=4.19.0",
    "rasterio>=1.5.2",
]

[project.optional-dependencies]
data-build = ["py3dep>=0.19.0", "rioxarray>=0.23.0"]
vision = ["opencv-python-headless>=5.0.0.93", "pillow>=13.0.0", "ultralytics>=8.4.207"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
