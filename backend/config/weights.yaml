# State Farm Flood Watch tunables. Reasoning lives in vault/Modules/Risk Scoring.md.

# Road status by water depth over the road, inches (NWS "Turn Around Don't Drown").
road_status_in:
  caution: 3     # 3 to <6 in: caution
  closed: 6      # >=6 in: closed for cars (stalls, loss of control)
  float: 12      # >=12 in: most vehicles may float
  boat: 24       # >=24 in: boat only (sweeps away SUVs and trucks)

flood:
  base_wse_m: 478.0           # just below the lowest road near the river (DEM min ~476 m)
  rise_m_per_min: 0.2         # sim minutes; 13 m crest in ~65 sim min (Jul 2025 crest at Kerrville was >10 m)
  max_rise_m: 13.0
  decay_m_per_km: 3.0         # water surface drop per km away from the river centerline
  reach_km: 1.5               # beyond this distance from the river, no flooding
  # calibrated 2026-11-07: ~36 closed segments at 30 min, ~240 (6%) at crest; see vault/Experiments

clock:
  tick_real_s: 1.0
  demo_speed: 60              # sim seconds per real second in demo mode

risk:
  weights:
    depth: 0.35               # depth on/near route, normalized to the "boat" threshold
    rise: 0.15                # rate of rise
    night: 0.10
    age: 0.12
    vehicle: 0.08
    situation: 0.20
    # Simulated profile factors (docs/driver-profile.md). Additive, so they can only raise urgency.
    needs: 0.10               # self-reported evacuation need
    unfamiliar: 0.03          # new to the area
    distraction: 0.04         # Drive Safe & Save phone-distraction rate
    signal: 0.15              # live State Farm signal: roadside request or ADT water sensor
    profile: 0.12             # baseline profile vulnerability (scoring/profile_risk.py), 0..1
  situation_levels: {planning: 0.2, driving_toward: 0.6, stopped_in_water: 1.0}
  vehicle_levels: {sedan: 0.6, compact: 0.8, ev: 0.8, suv: 0.3, truck: 0.1, minivan: 0.4}
  night_hours: [20, 6]        # 8 PM to 6 AM local
  older_age: 65
  teen_max_age: 19
  high_risk_threshold: 0.65   # flag responders immediately at or above this

# Baseline vulnerability from the simulated driver profile (docs/driver-profile.md). Weights sum to 1.
profile_risk:
  weights:
    crossing_exposure: 0.25   # trips/week over low-lying crossings (derived from DSS trips)
    night_driving: 0.10       # share of miles at night (derived)
    past_flood: 0.15          # past flood/water claim (sf_claims)
    behavior: 0.10            # DSS 14-day score and speeding rate (sf_dss)
    inexperience: 0.10        # licensed < 3 years or Steer Clear (sf_policy, sf_steer_clear)
    passengers: 0.15          # kids/dependents or pets aboard: getting out takes longer (self_reported)
    home_exposure: 0.10       # manufactured home (sf_policy)
    reachability: 0.05        # missed app check-in or location not "Always" (sf_dss)

stages:
  enroute_lookahead_m: 800
  stop_seconds: {normal: 60, demo: 5}
  dest_radius_m: 75

escalation_s:                 # seconds from case open
  normal: {call_driver: 0, contact_family: 120, dispatch_drone: 180}
  demo:   {call_driver: 0, contact_family: 12,  dispatch_drone: 18}

drone:
  speed_mps: 25
  demo_max_flight_s: 15       # compress the flight in demo mode
  station: {name: "Kerrville Fire Station 1", lat: 30.0505, lon: -99.1395}

claims:
  # ILLUSTRATIVE estimate: unique drivers kept off a closed road x avg claim x assumed share who'd have driven in.
  # Texas Dept. of Insurance Harvey data call: avg paid auto loss $19,943 over ~203k claims (Insurance Journal, 2018-02-13)
  avg_vehicle_claim_usd: 19943
  share_would_have_entered_water: 0.10  # assumption, stated in the UI tooltip
