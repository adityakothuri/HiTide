# Texas Hill Country demo region: Guadalupe River from the forks above Hunt through Ingram to Kerrville.
# Real event replayed: July 4, 2025 flash flood (see vault/Data Sources.md, vault/Experiments).
id: hill_country
name: "Kerr County: Hunt, Ingram, Kerrville"
bbox: {west: -99.45, south: 29.97, east: -99.10, north: 30.12}
timezone: America/Chicago

# Named waterways modeled with a bed profile + stage. Unnamed streams are kept for the floodable filter only.
waterways:
  - {name: "Guadalupe River", role: main}
  - {name: "North Fork Guadalupe River", role: fork}
  - {name: "South Fork Guadalupe River", role: fork}
  - {name: "Johnson Creek", role: tributary}
  - {name: "Cypress Creek", role: tributary}
  - {name: "Town Creek", role: tributary}
  - {name: "Third Creek", role: tributary}
  - {name: "Camp Meeting Creek", role: tributary}
  - {name: "Quinlan Creek", role: tributary}

# USGS gauges active on July 4, 2025 (parameter 00065, gage height ft). Locations fetched by scripts/fetch_july2025.py.
gauges:
  - {site: "08165300", name: "North Fork Guadalupe Rv nr Hunt", waterway: "North Fork Guadalupe River"}
  - {site: "08165500", name: "Guadalupe Rv at Hunt", waterway: "Guadalupe River"}
  - {site: "08166000", name: "Johnson Ck nr Ingram", waterway: "Johnson Creek"}
  - {site: "08166140", name: "Guadalupe Rv abv Bear Ck at Kerrville", waterway: "Guadalupe River"}
  - {site: "08166200", name: "Guadalupe Rv at Kerrville", waterway: "Guadalupe River"}

replay:
  date: "2025-07-04"
  start_local: "2025-07-04T01:00:00-05:00"
  end_local: "2025-07-04T07:30:00-05:00"
  # Real NWS / county timeline (KSAT 2025-08-03, NWS EWX E-5 report). Times are CDT.
  warnings:
    - {at: "2025-07-04T01:14:00-05:00", event: "Flash Flood Warning", area: "Kerr County"}
    - {at: "2025-07-04T04:04:00-05:00", event: "Flash Flood Emergency", area: "Hunt"}
    - {at: "2025-07-04T05:36:00-05:00", event: "Flash Flood Emergency", area: "Hunt to Kerrville"}
  checkpoints:  # used by the calibration experiment
    - {at: "2025-07-04T04:22:00-05:00", what: "SH 39 in Hunt under water (KSAT)", near: [-99.335, 30.071]}
    - {at: "2025-07-04T05:45:00-05:00", what: "Kerrville gauge reaches minor flood (NWS)", near: [-99.140, 30.047]}

# Truth model for waterways with no reporting gauge on July 4, 2025 (labelled "modeled" everywhere).
# rise(t) = scale x donor gauge rise(t + lead_s). The South Fork took the heaviest rain (7-12 in in ~3 h).
ungauged:
  "South Fork Guadalupe River": {donor: "08165300", scale: 1.3, lead_s: 1800}
  "Cypress Creek":              {donor: "08165300", scale: 0.8, lead_s: 1800}
  "Town Creek":                 {donor: "08166000", scale: 0.6, lead_s: 900}
  "Third Creek":                {donor: "08166000", scale: 0.5, lead_s: 900}
  "Camp Meeting Creek":         {donor: "08166000", scale: 0.6, lead_s: 900}
  "Quinlan Creek":              {donor: "08166000", scale: 0.5, lead_s: 900}
minor_streams: {donor: "08166000", scale: 0.35, lead_s: 1200}   # unnamed low-water crossings
# A dead gauge's truth continues from a downstream donor's shape (Hunt died at 05:10 CDT).
gap_fill: {"08165500": "08166140"}
lateral_reach_m: {main: 2500, fork: 1500, tributary: 600}
# Heavy rain (> 1 in/hr) per NWS EWX report: 7-12 in over the South Fork in ~3 h, peak 4-5 in/hr; Hunt gauge 7.56 in by 04:35.
heavy_rain: {from: "2025-07-04T02:00:00-05:00", to: "2025-07-04T05:00:00-05:00", west_of_lon: -99.25}
